{% extends "base/app_base.html" %}

{% block title %}Delete Event{% endblock %}

{% block main %}
    <div class="narrow-content-container">
        <h1>Confirm Delete</h1>
        <p>You are about to delete <b>{{ event.event_title }}</b> on {{ event.event_date }} ({{ event.start_time }} – {{ event.end_time }}). This action cannot be undone.</p>

        <form action="{{ url_for('delete_event') }}" method="post">
            <button>Delete</button>
        </form>

        <a href="{{ url_for('timetable') }}">Cancel</a>
    </div>
{% endblock %}
