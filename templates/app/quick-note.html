{% extends 'base/app_base.html' %}

{% block title %}Quick Note{% endblock %}

{% block main %}
    <div class="narrow-content-container">
        <h1>Quick Note</h1>

        <form action="{{ url_for('update_quick_note') }}" method="post" class="form-with-bg">
            <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">

            <div class="form-group">
                <label for="quick_note">Edit quick note</label>
                <textarea name="quick_note" id="quick_note">{{ quick_note }}</textarea> 
            </div>

            <button>Save changes</button>
        </form>
    </div>
{% endblock %}
