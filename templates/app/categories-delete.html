{% extends "base/app_base.html" %}

{% block title %}Delete Category{% endblock %}

{% block main %}
    <div class="narrow-content-container">
        <h1>Confirm Delete</h1>
        <p>You are about to delete the category <b>{{ data.category_name }}</b>. This action cannot be undone.</p>

        <form action="{{ url_for('delete_category') }}" method="post">
            <input type="hidden" name="category_id" value="{{ data.category_id }}">
            <div class="two-options">
                <button>Delete</button>
                <a href="{{ url_for('view_categories') }}">Cancel</a>
            </div>
        </form>

    </div>
{% endblock %}
